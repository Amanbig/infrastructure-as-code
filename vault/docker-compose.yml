# Vault in DEV mode: in-memory, auto-unsealed, fixed root token.
# For learning ONLY. Never use dev mode in production.
services:
  vault:
    image: hashicorp/vault:1.17
    container_name: vault-dev
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
