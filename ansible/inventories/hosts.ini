# ==============================================================================
# Ansible Inventory File (hosts.ini)
# ==============================================================================
# Defines hosts, groups, and connection variables.
# ==============================================================================

[local]
localhost ansible_connection=local

[webservers]
web-01 ansible_host=192.168.1.101 http_port=80
web-02 ansible_host=192.168.1.102 http_port=80

[dbservers]
db-01  ansible_host=192.168.1.105 db_port=5432

[production:children]
webservers
dbservers

[production:vars]
environment_name=production
monitoring_enabled=true
