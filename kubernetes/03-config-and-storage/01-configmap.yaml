# ==============================================================================
# Kubernetes Config & Storage: 01 - ConfigMap
# ==============================================================================
# What is a ConfigMap?
# An API object used to store non-confidential data in key-value pairs.
# Pods can consume ConfigMaps as environment variables, command-line arguments,
# or as configuration files in a volume.
#
# Best practice: Decouple configuration artifacts from image content to keep
# containerized applications portable across environments (12-Factor App).
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-configuration
  namespace: default
data:
  # Key-value pairs injected as individual environment variables
  APP_ENV: "production"
  LOG_LEVEL: "info"
  MAX_CONNECTIONS: "100"

  # Multi-line file content mounted as a configuration file inside the pod
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /healthz {
            return 200 "OK\n";
        }
    }
---
# Example Pod consuming the ConfigMap via env and volume mount
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo-pod
spec:
  volumes:
    - name: config-volume
      configMap:
        name: app-configuration
        items:
          - key: nginx.conf
            path: nginx.conf

  containers:
    - name: web
      image: nginx:1.25-alpine
      # 1. Inject individual keys as environment variables
      env:
        - name: CURRENT_ENV
          valueFrom:
            configMapKeyRef:
              name: app-configuration
              key: APP_ENV
      # 2. Mount config file from ConfigMap
      volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
          readOnly: true
