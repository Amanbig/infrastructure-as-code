# ==============================================================================
# Kubernetes Config & Storage: 02 - Secrets
# ==============================================================================
# What is a Secret?
# A Kubernetes Secret lets you store and manage sensitive information, such as
# passwords, OAuth tokens, and ssh keys. Storing confidential information in a
# Secret is safer and more flexible than putting it verbatim in a Pod definition
# or in a container image.
#
# IMPORTANT SECURITY NOTE:
# Standard Kubernetes secrets are base64-encoded, NOT encrypted by default!
# To secure them in production:
# - Enable Encryption at Rest in the API server
# - Use RBAC to restrict access
# - Use tools like HashiCorp Vault, Sealed Secrets, or External Secrets Operator (ESO)
#
# 'stringData' allows plain strings in YAML; Kubernetes base64-encodes them automatically!
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: default
type: Opaque # Standard generic secret
stringData:
  DB_HOST: "postgres-db.default.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "db_admin"
  DB_PASSWORD: "SuperSecurePassword123!" # K8s converts this to base64
---
# Pod demonstrating consuming Secrets
apiVersion: v1
kind: Pod
metadata:
  name: secret-consumer-pod
spec:
  containers:
    - name: api
      image: alpine:latest
      command: ["/bin/sh", "-c", "echo Connected to $DB_HOST with user $DB_USER; sleep 3600"]
      env:
        # Load specific secret key as environment variable
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_PASSWORD
      # Or load all keys from secret at once:
      envFrom:
        - secretRef:
            name: database-credentials
