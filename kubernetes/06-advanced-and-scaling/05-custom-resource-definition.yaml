# ==============================================================================
# Kubernetes Advanced: 05 - CustomResourceDefinition (CRD) and Custom Resource
# ==============================================================================
# What is a CustomResourceDefinition (CRD)?
# The CustomResourceDefinition API resource allows you to define custom resources.
# Defining a CRD creates a new RESTful resource path in the Kubernetes API.
# This enables the Operator pattern (e.g., Prometheus Operator, ArgoCD, Kafka Strimzi).
#
# Once registered, Kubernetes validates custom resources using OpenAPI v3 schemas.
# ==============================================================================

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backuppolicies.devops.learn.io
spec:
  group: devops.learn.io
  names:
    kind: BackupPolicy
    listKind: BackupPolicyList
    plural: backuppolicies
    singular: backuppolicy
    shortNames:
      - bp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["storageBucket", "cronSchedule"]
              properties:
                storageBucket:
                  type: string
                cronSchedule:
                  type: string
                retentionDays:
                  type: integer
                  minimum: 1
                  default: 30
      additionalPrinterColumns:
        - name: Bucket
          type: string
          jsonPath: .spec.storageBucket
        - name: Schedule
          type: string
          jsonPath: .spec.cronSchedule
---
# An instance of our new Custom Resource
apiVersion: devops.learn.io/v1alpha1
kind: BackupPolicy
metadata:
  name: nightly-postgres-backup
  namespace: default
spec:
  storageBucket: "s3://company-production-backups/postgres"
  cronSchedule: "0 2 * * *"
  retentionDays: 45
