# ==============================================================================
# Kubernetes Advanced: 01 - Horizontal Pod Autoscaler (HPA)
# ==============================================================================
# What is HPA?
# Automatically scales the number of Pods in a Deployment or ReplicaSet
# based on observed CPU utilization, Memory, or custom metrics (e.g. HTTP requests/sec).
#
# Prerequisite: Metrics Server must be running in the cluster (`kubectl top nodes/pods`).
# Also, containers MUST have resource `requests` defined in their Deployment!
#
# Commands:
#   kubectl apply -f 01-hpa.yaml
#   kubectl get hpa webapp-hpa -w
# ==============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webapp-hpa
  namespace: default
spec:
  # Target resource to autoscale
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webapp-deployment

  # Scaling boundaries
  minReplicas: 2
  maxReplicas: 10

  # Metrics triggering autoscaling
  metrics:
    # 1. Target CPU utilization average across pods
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # Scale up if avg CPU exceeds 70% of requests

    # 2. Target Memory utilization average across pods
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80 # Scale up if avg Memory exceeds 80%

  # Advanced scaling behavior (stabilization windows prevent flapping)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # Wait 5 minutes before scaling down
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0   # Scale up immediately when traffic spikes
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
