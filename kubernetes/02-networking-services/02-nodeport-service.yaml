# ==============================================================================
# Kubernetes Networking: 02 - NodePort Service
# ==============================================================================
# What is a NodePort Service?
# Exposes the Service on each Node's IP at a static port (by default: 30000-32767).
# A ClusterIP Service, to which the NodePort Service routes, is automatically created.
#
# You'll be able to contact the NodePort Service from outside the cluster by
# requesting: <NodeIP>:<NodePort>
#
# Use cases:
# - Development/Minikube testing
# - On-prem bare metal setups where cloud LoadBalancers aren't available
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: nodeport-service
  namespace: default
  labels:
    app: nodeport-demo
spec:
  type: NodePort
  selector:
    app: nodeport-demo
  ports:
    - name: http
      protocol: TCP
      port: 80         # Internal cluster port
      targetPort: 80   # Port on the container
      nodePort: 30080  # Optional: manually assigned port in range 30000-32767
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeport-demo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodeport-demo
  template:
    metadata:
      labels:
        app: nodeport-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
