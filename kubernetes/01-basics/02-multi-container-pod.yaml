# ==============================================================================
# Kubernetes Basics: 02 - Multi-Container Pod (Sidecar Pattern)
# ==============================================================================
# What is a Multi-Container Pod?
# Containers in the same Pod share the same network namespace (localhost), IP,
# and can share filesystem storage using shared Volumes.
#
# Common Patterns:
# 1. Sidecar: Extends or enhances the main container (e.g. log collector, proxy)
# 2. Adapter: Standardizes output or monitoring format
# 3. Ambassador: Proxies network connections to external services
#
# Commands to test this manifest:
#   kubectl apply -f 02-multi-container-pod.yaml
#   kubectl logs multi-container-demo -c app-container
#   kubectl logs multi-container-demo -c log-collector-sidecar
#   kubectl delete -f 02-multi-container-pod.yaml
# ==============================================================================

apiVersion: v1
kind: Pod
metadata:
  name: multi-container-demo
  labels:
    app: multi-container-demo
spec:
  # Shared volume mounted into both containers
  volumes:
    - name: shared-log-volume
      emptyDir: {}   # Ephemeral directory alive as long as Pod runs

  containers:
    # Main Application Container: writes logs to the shared volume
    - name: app-container
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          while true; do
            echo "$(date -u) [INFO] Application event generated by main app" >> /var/log/app/app.log;
            sleep 5;
          done
      volumeMounts:
        - name: shared-log-volume
          mountPath: /var/log/app
      resources:
        requests:
          memory: "32Mi"
          cpu: "25m"
        limits:
          memory: "64Mi"
          cpu: "50m"

    # Sidecar Container: streams/processes the shared log file
    - name: log-collector-sidecar
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          tail -n +1 -F /var/log/app/app.log;
      volumeMounts:
        - name: shared-log-volume
          mountPath: /var/log/app
          readOnly: true
      resources:
        requests:
          memory: "32Mi"
          cpu: "25m"
        limits:
          memory: "64Mi"
          cpu: "50m"
