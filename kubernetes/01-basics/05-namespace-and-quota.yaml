# ==============================================================================
# Kubernetes Basics: 05 - Namespace, ResourceQuota, and LimitRange
# ==============================================================================
# What are Namespaces?
# Namespaces provide a mechanism for isolating groups of resources within a
# single cluster (e.g. dev, staging, prod, or team-a, team-b).
#
# What is a ResourceQuota?
# Sets hard constraints on total compute resources (CPU, Memory) and object
# counts (Pods, Services) that can be consumed inside a Namespace.
#
# What is a LimitRange?
# Enforces default requests/limits for individual Pods/Containers created in
# a namespace where the author didn't explicitly specify them.
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: demo-environment
  labels:
    environment: learning
    tier: dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: demo-environment
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
    services: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: demo-environment
spec:
  limits:
    - default:             # Default limits if not specified
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:      # Default requests if not specified
        cpu: "100m"
        memory: "128Mi"
      max:                 # Upper ceiling for any single container
        cpu: "1"
        memory: "1Gi"
      min:                 # Lower floor for any single container
        cpu: "20m"
        memory: "32Mi"
      type: Container
