# ==============================================================================
# Kubernetes Security & RBAC: 01 - ServiceAccount
# ==============================================================================
# What is a ServiceAccount?
# While human users authenticate with kubectl via certificates or identity providers
# (like OIDC, LDAP), processes in containers that talk to the API server authenticate
# using a ServiceAccount.
#
# When you create a Pod, if you do not specify a service account, it is automatically
# assigned the 'default' service account in that namespace.
#
# Best practice: Create dedicated ServiceAccounts with least privilege for every application!
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: default
  labels:
    app: secure-app
  annotations:
    # Example IAM Roles for Service Accounts (IRSA on AWS EKS):
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/MyEKSAppRole
    # Or Workload Identity on GCP GKE:
    # iam.gke.io/gcp-service-account: my-app@my-project.iam.gserviceaccount.com
automountServiceAccountToken: true # Set to false if Pod never talks to K8s API!
