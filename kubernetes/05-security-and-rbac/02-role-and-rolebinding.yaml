# ==============================================================================
# Kubernetes Security & RBAC: 02 - Role and RoleBinding (Namespaced)
# ==============================================================================
# What is RBAC?
# Role-Based Access Control (RBAC) regulates access to Kubernetes API resources
# based on the roles of individual users or service accounts.
#
# - Role: Contains rules that represent a set of permissions within a specific namespace.
# - RoleBinding: Grants the permissions defined in a Role to a user, group, or ServiceAccount.
#
# Rules are purely additive (there are no "deny" rules in Kubernetes RBAC).
# ==============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: pod-and-config-reader
rules:
  # Core API group (empty string "" means core group)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  # ConfigMaps access
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-binding
  namespace: default
subjects:
  # Bind to our ServiceAccount created in 01-serviceaccount.yaml
  - kind: ServiceAccount
    name: app-service-account
    namespace: default
roleRef:
  # Reference to the Role defined above
  kind: Role
  name: pod-and-config-reader
  apiGroup: rbac.authorization.k8s.io
