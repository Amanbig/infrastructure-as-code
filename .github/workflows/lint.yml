name: Lint & Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Chart Lint
        run: helm lint helm/01-chart-structure/my-web-app

      - name: Terraform Validate
        run: |
          for dir in terraform/01-basics terraform/03-environments/dev terraform/03-environments/prod; do
            echo "Validating $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - name: Packer Format Check
        run: |
          docker run --rm --entrypoint packer -v "$PWD/packer:/w" -w /w hashicorp/packer:latest fmt -check .

      - name: Helm Template (all environments)
        run: |
          for f in helm/02-environments/values-*.yaml; do
            helm template demo helm/01-chart-structure/my-web-app -f "$f" > /dev/null
          done

      - name: Kustomize Build
        run: |
          kubectl kustomize kubernetes/07-kustomize/overlays/dev > /dev/null
          kubectl kustomize kubernetes/07-kustomize/overlays/prod > /dev/null

      - name: Install lint tools
        run: python3 -m pip install yamllint ansible

      - name: YAML Lint
        run: yamllint -c .yamllint.yml kubernetes ansible gitops observability vault

      - name: Ansible Syntax Check
        run: |
          cd ansible
          for p in playbooks/*.yml; do
            ansible-playbook --syntax-check -i inventories/hosts.ini "$p"
          done

      - name: Dockerfile Lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/01-dockerfiles/Dockerfile.python
          failure-threshold: error

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sample images
        run: make docker-build
