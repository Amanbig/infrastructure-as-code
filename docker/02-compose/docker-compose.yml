version: '3.8'

# ==============================================================================
# Complete Full-Stack Multi-Container Environment
# ==============================================================================
# Services:
# 1. proxy: Nginx reverse proxy routing traffic
# 2. web: Application web server
# 3. postgres: Relational database with persistent volume & health check
# 4. redis: Fast in-memory caching layer
# ==============================================================================

services:
  proxy:
    image: nginx:1.25-alpine
    container_name: devops-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
    networks:
      - frontend-net

  web:
    image: hashicorp/http-echo:0.2.3
    container_name: devops-web
    command: ["-text=Hello from Containerized Service", "-listen=:8080"]
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - frontend-net
      - backend-net

  postgres:
    image: postgres:16-alpine
    container_name: devops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  redis:
    image: redis:7.2-alpine
    container_name: devops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
